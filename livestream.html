<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特斯拉车载直播系统</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.8);
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .danmu-container {
            height: 300px;
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }
        .danmu-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
        }
        .status {
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>特斯拉车载直播系统</h1>
        <div class="video-container">
            <video id="videoElement" autoplay playsinline></video>
            <div class="controls">
                <button id="startButton">开始直播</button>
                <button id="switchCamera">切换摄像头</button>
                <button id="stopButton">停止直播</button>
            </div>
        </div>
        <div class="status">
            <div id="networkStatus">网络状态: 良好</div>
            <div id="batteryStatus">电池电量: 获取中...</div>
        </div>
        <div class="danmu-container" id="danmuContainer">
            <!-- 弹幕将在这里显示 -->
        </div>
        <div class="danmu-input">
            <input type="text" id="danmuInput" placeholder="发送弹幕...">
            <button id="sendDanmu">发送</button>
        </div>
    </div>

    <script>
        let stream;
        let facingMode = "user"; // 默认使用前置摄像头

        async function startStream() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: true
                });
                document.getElementById('videoElement').srcObject = stream;
            } catch (err) {
                console.error('获取摄像头失败:', err);
                alert('获取摄像头失败，请确保已授予权限');
            }
        }

        function stopStream() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('videoElement').srcObject = null;
            }
        }

        function switchCamera() {
            stopStream();
            facingMode = facingMode === "user" ? "environment" : "user";
            startStream();
        }

        // 模拟发送弹幕
        function sendDanmu() {
            const input = document.getElementById('danmuInput');
            const container = document.getElementById('danmuContainer');
            if (input.value.trim()) {
                const danmu = document.createElement('div');
                danmu.textContent = input.value;
                danmu.style.color = '#fff';
                container.appendChild(danmu);
                container.scrollTop = container.scrollHeight;
                input.value = '';
            }
        }

        // 模拟获取电池状态
        async function getBatteryStatus() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    document.getElementById('batteryStatus').textContent = 
                        `电池电量: ${Math.round(battery.level * 100)}%`;
                }
            } catch (err) {
                console.error('获取电池状态失败:', err);
            }
        }

        // 事件监听
        document.getElementById('startButton').onclick = startStream;
        document.getElementById('stopButton').onclick = stopStream;
        document.getElementById('switchCamera').onclick = switchCamera;
        document.getElementById('sendDanmu').onclick = sendDanmu;
        document.getElementById('danmuInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendDanmu();
        };

        // 初始化
        getBatteryStatus();
        setInterval(getBatteryStatus, 60000); // 每分钟更新一次电池状态
    </script>
</body>
</html>
