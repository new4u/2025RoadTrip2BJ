<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳到北京自驾路线规划</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        #map {
            height: 600px;
            flex: 2;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .schedule {
            flex: 1;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }
        h1, h2 {
            color: #333;
        }
        .day-schedule {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .segment {
            border-left: 3px solid #4CAF50;
            margin: 10px 0;
            padding-left: 10px;
        }
        .time {
            color: #2196F3;
            font-weight: bold;
        }
        .activity {
            color: #333;
            margin: 5px 0;
        }
        .notes {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        .service-area {
            background: #e3f2fd;
            padding: 8px;
            border-radius: 5px;
            margin-top: 5px;
        }
        .tesla-info {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>深圳到北京自驾路线规划 (2025.1.24-28)</h1>
    <div class="container">
        <div id="map"></div>
        <div class="schedule">
            <h2>行程安排</h2>
            <div id="schedule-content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // 地图初始化
        const map = L.map('map').setView([34.5, 114], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 路线坐标点
        const routePoints = [
            { name: "深圳幸福里", coords: [22.5431, 114.0579] },
            { name: "平安服务区", coords: [23.1523, 114.3821] },
            { name: "龙门服务区", coords: [23.7482, 114.2547] },
            { name: "万安服务区", coords: [26.4568, 114.7856] },
            { name: "永修服务区", coords: [29.0214, 115.8012] },
            { name: "天柱山服务区", coords: [31.7526, 116.0234] },
            { name: "霍山服务区", coords: [31.3956, 116.3321] },
            { name: "辛集服务区", coords: [37.9425, 115.2178] },
            { name: "东昌府服务区", coords: [36.4538, 115.9887] },
            { name: "雄县停车区", coords: [38.9943, 116.1087] },
            { name: "牛驼服务区", coords: [39.4521, 116.3254] },
            { name: "北京安乐林二条", coords: [39.9042, 116.4074] }
        ];

        // 绘制路线
        const routeLine = L.polyline(routePoints.map(p => p.coords), {
            color: '#2196F3',
            weight: 3
        }).addTo(map);

        // 添加标记点
        routePoints.forEach(point => {
            L.marker(point.coords)
                .bindPopup(point.name)
                .addTo(map);
        });

        // 适应地图视图
        map.fitBounds(routeLine.getBounds());

        // 加载行程数据
        fetch('route_schedule.json')
            .then(response => response.json())
            .then(data => {
                const scheduleContent = document.getElementById('schedule-content');
                
                // 创建起点信息
                const startDiv = document.createElement('div');
                startDiv.className = 'day-schedule';
                startDiv.innerHTML = `
                    <h3>出发信息</h3>
                    <div class="segment">
                        <div class="time">${data.trip_info.start_time}</div>
                        <div class="activity">从${data.trip_info.start_location}出发</div>
                        <div class="notes">
                            • 预计行程：${data.trip_info.estimated_duration}<br>
                            • 总距离：${data.trip_info.total_distance}公里
                        </div>
                    </div>
                `;
                scheduleContent.appendChild(startDiv);

                // 创建城市路线
                const citiesDiv = document.createElement('div');
                citiesDiv.className = 'day-schedule';
                citiesDiv.innerHTML = `
                    <h3>途经城市</h3>
                    ${data.cities.map(city => `
                        <div class="segment">
                            <div class="time">${city.arrival_time}</div>
                            <div class="activity">到达${city.name}</div>
                            <div class="notes">• 行驶时间：${city.duration_from_start}</div>
                        </div>
                    `).join('')}
                `;
                scheduleContent.appendChild(citiesDiv);

                // 创建服务区信息
                const serviceAreasDiv = document.createElement('div');
                serviceAreasDiv.className = 'day-schedule';
                serviceAreasDiv.innerHTML = `
                    <h3>服务区信息</h3>
                    ${data.service_areas.map(area => `
                        <div class="segment">
                            <div class="time">${area.arrival_time}</div>
                            <div class="activity">到达${area.name}</div>
                            <div class="service-area">
                                <div class="facilities">
                                    ${area.features.charging ? '⚡ 充电设施' : ''}
                                    ${area.features.parking ? '🅿️ 停车场' : ''}
                                    ${area.features.rest_area ? '🛏️ 休息区' : ''}
                                    ${area.features.food ? '🍽️ 餐饮' : ''}
                                </div>
                                ${area.traffic_level ? `
                                    <div class="traffic-level">
                                        🚗 人流量：${{'low': '较少', 'medium': '适中', 'high': '较多'}[area.traffic_level]}
                                    </div>
                                ` : ''}
                                ${area.special_notes ? `
                                    <div class="notes">
                                        • ${area.special_notes}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                `;
                scheduleContent.appendChild(serviceAreasDiv);

                // 创建重要提醒
                const notesDiv = document.createElement('div');
                notesDiv.className = 'day-schedule';
                notesDiv.innerHTML = `
                    <h3>重要提醒</h3>
                    <div class="segment">
                        <div class="activity">高速免费时间</div>
                        <div class="notes">
                            • 开始：${data.important_notes.toll_free_period.start}<br>
                            • 结束：${data.important_notes.toll_free_period.end}<br>
                            • ${data.important_notes.toll_free_period.description}
                        </div>
                    </div>
                    <div class="segment">
                        <div class="activity">沿途设施</div>
                        <div class="notes">
                            ${data.important_notes.facilities.map(facility => `• ${facility}`).join('<br>')}
                        </div>
                    </div>
                `;
                scheduleContent.appendChild(notesDiv);
            })
            .catch(error => console.error('Error loading schedule:', error));
    </script>
</body>
</html>
